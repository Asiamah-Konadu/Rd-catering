<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Create Admin Account | Rich Don's Catering</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18352e;
        --muted: #61736d;
        --line: #d6e0da;
        --paper: #fbfcf8;
        --green: #176b4b;
        --green-dark: #10563b;
        --orange: #e58a3a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 18px;
        display: grid;
        place-items: center;
        color: var(--ink);
        background-color: #edf3ed;
        background-image: radial-gradient(#c6d7cb 0.7px, transparent 0.7px);
        background-size: 18px 18px;
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(100%, 460px);
        padding: 36px;
        border: 1px solid var(--line);
        border-top: 4px solid var(--orange);
        background: var(--paper);
        box-shadow: 0 18px 55px rgb(24 53 46 / 10%);
        animation: arrive 380ms ease-out both;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--green);
        font: 700 11px/1.4 Arial, sans-serif;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 500;
        line-height: 1.12;
      }

      .intro {
        margin: 12px 0 26px;
        color: var(--muted);
        font: 14px/1.55 Arial, sans-serif;
      }

      form { display: grid; gap: 17px; }

      label {
        display: grid;
        gap: 7px;
        font: 700 12px/1.4 Arial, sans-serif;
      }

      input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: white;
        color: var(--ink);
        font: 15px/1.4 Arial, sans-serif;
      }

      input:focus {
        border-color: var(--green);
        outline: 3px solid rgb(23 107 75 / 15%);
      }

      .password-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .show-password {
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: white;
        color: var(--green-dark);
        font: 700 12px Arial, sans-serif;
        cursor: pointer;
      }

      .hint {
        margin: -10px 0 0;
        color: var(--muted);
        font: 12px/1.45 Arial, sans-serif;
      }

      button[type="submit"] {
        min-height: 46px;
        margin-top: 4px;
        border: 0;
        border-radius: 3px;
        background: var(--green);
        color: white;
        font: 700 14px Arial, sans-serif;
        cursor: pointer;
      }

      button[type="submit"]:hover { background: var(--green-dark); }
      button:disabled { cursor: wait; opacity: 0.7; }

      #result {
        display: none;
        margin: 18px 0 0;
        padding: 12px;
        border-left: 3px solid var(--green);
        background: #eaf3ed;
        font: 13px/1.5 Arial, sans-serif;
        overflow-wrap: anywhere;
      }

      #result.error {
        border-color: #bd493c;
        background: #fbefed;
        color: #7b2d25;
      }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 480px) {
        main { padding: 26px 22px; }
        h1 { font-size: 29px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Initial account setup</p>
      <h1>Create an admin account</h1>
      <p class="intro">The password is sent to this app's setup endpoint and is not saved in this page.</p>

      <form id="admin-form">
        <label>
          Name
          <input name="name" autocomplete="name" value="Asiamah-Konadu" required />
        </label>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" value="asiamah@rdcatering.com" required />
        </label>
        <label>
          Password
          <span class="password-row">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required />
            <button class="show-password" id="toggle-password" type="button" aria-pressed="false">Show</button>
          </span>
        </label>
        <p class="hint">Use at least 12 characters. Choose a unique password.</p>
        <button id="submit-button" type="submit">Create admin account</button>
      </form>
      <p id="result" role="status" aria-live="polite"></p>
    </main>

    <script>
      const form = document.querySelector("#admin-form");
      const passwordInput = document.querySelector("#password");
      const togglePassword = document.querySelector("#toggle-password");
      const submitButton = document.querySelector("#submit-button");
      const result = document.querySelector("#result");

      togglePassword.addEventListener("click", () => {
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";
        togglePassword.textContent = showing ? "Show" : "Hide";
        togglePassword.setAttribute("aria-pressed", String(!showing));
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        result.className = "";
        result.style.display = "none";

        const formData = new FormData(form);
        try {
          const response = await fetch("/api/admin/setup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: formData.get("name"),
              email: formData.get("email"),
              password: formData.get("password"),
              role: "ADMIN",
            }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Account setup failed.");
          result.textContent = data.message || "Admin account created.";
          form.reset();
        } catch (error) {
          result.textContent = error instanceof Error ? error.message : "Account setup failed.";
          result.className = "error";
        } finally {
          passwordInput.value = "";
          result.style.display = "block";
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
